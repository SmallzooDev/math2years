<!doctype html>
<html lang="{{ site.Language.Lang }}" data-scheme="{{ site.Params.scheme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ partial "title.html" . }} | {{ site.Title }}{{ end }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{ site.Params.fonts }}">
<link rel="stylesheet" href="{{ site.Params.katex }}" crossorigin="anonymous">
{{- $css := resources.Get "css/site.css" | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
{{- $js := resources.Get "js/toc.js" | fingerprint }}
<script src="{{ $js.RelPermalink }}" defer></script>
</head>
<body>
<div class="layout">
  {{ partial "nav.html" . }}
  <main>{{ block "content" . }}{{ end }}</main>
  <aside class="side-toc">{{ block "toc" . }}{{ end }}</aside>
</div>
</body>
</html>
